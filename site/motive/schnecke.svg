  <circle class="v" cx="274" cy="164" r="12"/>
  <circle class="v" cx="320" cy="166" r="12"/>
  <circle class="h" cx="270" cy="160" r="4"/>
  <circle class="h" cx="316" cy="162" r="4"/>
  <path class="hl" stroke-width="6" d="M288 244 Q298 252 310 244"/>

  <!-- Haus mit weißer Kante und Spirale -->
