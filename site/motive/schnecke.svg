<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <style>
    /* Farbrollen (siehe README). Die Fallback-Werte gelten nur beim direkten Öffnen der Datei. */
    .v { fill: var(--v, #000); }
    .h { fill: var(--h, #fff); }
    .f1 { fill: var(--f1, var(--v, #000)); }
    .f2 { fill: var(--f2, var(--v, #000)); }
    .f3 { fill: var(--f3, var(--v, #000)); }
    .vl, .hl, .f1l, .f2l, .f3l { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .vl { stroke: var(--v, #000); }
    .hl { stroke: var(--h, #fff); }
    .f1l { stroke: var(--f1, var(--v, #000)); }
    .f2l { stroke: var(--f2, var(--v, #000)); }
    .f3l { stroke: var(--f3, var(--v, #000)); }
  </style>

  <rect class="h" width="400" height="400"/>

  <!-- Gezeichnet in freien Koordinaten, hier zentriert -->
  <g transform="translate(-4 -6)">

  <!-- Körper: Fuß und aufgerichteter Kopf -->
  <g class="v">
    <rect x="76" y="264" width="250" height="38" rx="19"/>
    <rect x="268" y="206" width="58" height="90" rx="29"/>
  </g>
  <!-- Fühler mit Augen -->
  <path class="vl" stroke-width="9" d="M286 214 L274 166"/>
