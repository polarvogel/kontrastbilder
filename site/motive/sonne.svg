<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <style>
    /* Farbrollen (siehe README). Die Fallback-Werte gelten nur beim direkten Öffnen der Datei. */
    .v { fill: var(--v, #000); }
    .h { fill: var(--h, #fff); }
    .f1 { fill: var(--f1, var(--v, #000)); }
    .f2 { fill: var(--f2, var(--v, #000)); }
    .f3 { fill: var(--f3, var(--v, #000)); }
    .vl { fill: none; stroke: var(--v, #000); stroke-linecap: round; stroke-linejoin: round; }
    .hl { fill: none; stroke: var(--h, #fff); stroke-linecap: round; stroke-linejoin: round; }

    /* Strahlenkranz dreht sich einmal in 48 s */
    .strahlen { transform-origin: 200px 200px; animation: drehen 48s linear infinite; }
    @keyframes drehen { to { transform: rotate(360deg); } }
  </style>

  <rect class="h" width="400" height="400"/>

  <!-- 12 Strahlen, je 30° versetzt -->
  <g class="strahlen f1">
    <rect x="186" y="62" width="28" height="46" rx="14"/>
    <rect x="186" y="62" width="28" height="46" rx="14" transform="rotate(30 200 200)"/>
    <rect x="186" y="62" width="28" height="46" rx="14" transform="rotate(60 200 200)"/>
    <rect x="186" y="62" width="28" height="46" rx="14" transform="rotate(90 200 200)"/>
    <rect x="186" y="62" width="28" height="46" rx="14" transform="rotate(120 200 200)"/>
    <rect x="186" y="62" width="28" height="46" rx="14" transform="rotate(150 200 200)"/>
    <rect x="186" y="62" width="28" height="46" rx="14" transform="rotate(180 200 200)"/>
    <rect x="186" y="62" width="28" height="46" rx="14" transform="rotate(210 200 200)"/>
    <rect x="186" y="62" width="28" height="46" rx="14" transform="rotate(240 200 200)"/>
    <rect x="186" y="62" width="28" height="46" rx="14" transform="rotate(270 200 200)"/>
    <rect x="186" y="62" width="28" height="46" rx="14" transform="rotate(300 200 200)"/>
    <rect x="186" y="62" width="28" height="46" rx="14" transform="rotate(330 200 200)"/>
  </g>

  <!-- Kern mit Gesicht als Aussparung -->
  <circle class="f1" cx="200" cy="200" r="66"/>
  <circle class="h" cx="176" cy="186" r="11"/>
  <circle class="h" cx="224" cy="186" r="11"/>
  <path class="hl" stroke-width="10" d="M174 218 Q200 242 226 218"/>
</svg>
