<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" data-farbe-f1="rosa">
  <style>
    /* Farbrollen (siehe README). Die Fallback-Werte gelten nur beim direkten Öffnen der Datei. */
    .v { fill: var(--v, #000); }
    .h { fill: var(--h, #fff); }
    .f1 { fill: var(--f1, var(--v, #000)); }
    .f2 { fill: var(--f2, var(--v, #000)); }
    .f3 { fill: var(--f3, var(--v, #000)); }
    .d1 { fill: var(--d1, var(--h, #fff)); }
    .vl, .hl, .f1l, .f2l, .f3l, .d1l { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .vl { stroke: var(--v, #000); }
    .hl { stroke: var(--h, #fff); }
    .f1l { stroke: var(--f1, var(--v, #000)); }
    .f2l { stroke: var(--f2, var(--v, #000)); }
    .f3l { stroke: var(--f3, var(--v, #000)); }
    .d1l { stroke: var(--d1, var(--h, #fff)); }

    /* Qualle schwebt in 6 s auf und ab, Tentakel wiegen sich versetzt */
    .qualle { animation: schweben 6s ease-in-out infinite alternate; }
    @keyframes schweben {
      from { transform: translateY(-10px); }
      to { transform: translateY(10px); }
    }
    .tentakel { animation: wiegen 4s ease-in-out infinite alternate; }
    .s1 { transform-origin: 130px 200px; }
    .s2 { transform-origin: 165px 200px; animation-delay: -1s; }
    .s3 { transform-origin: 200px 200px; animation-delay: -2s; }
    .s4 { transform-origin: 235px 200px; animation-delay: -3s; }
    .s5 { transform-origin: 270px 200px; animation-delay: -4s; }
    @keyframes wiegen {
      from { transform: rotate(-6deg); }
      to { transform: rotate(6deg); }
    }
  </style>

  <rect class="h" width="400" height="400"/>

  <g class="qualle">
    <g class="tentakel s1"><path class="f1l" stroke-width="14" d="M130 200 q-14 22 0 44 t0 44 t0 38"/></g>
    <g class="tentakel s2"><path class="f1l" stroke-width="14" d="M165 200 q-14 22 0 44 t0 44 t0 38"/></g>
    <g class="tentakel s3"><path class="f1l" stroke-width="14" d="M200 200 q-14 22 0 44 t0 44 t0 38"/></g>
    <g class="tentakel s4"><path class="f1l" stroke-width="14" d="M235 200 q-14 22 0 44 t0 44 t0 38"/></g>
    <g class="tentakel s5"><path class="f1l" stroke-width="14" d="M270 200 q-14 22 0 44 t0 44 t0 38"/></g>
    <!-- Schirm mit gewelltem Rand -->
    <g class="f1">
      <path d="M90 180 A110 110 0 0 1 310 180 Z"/>
      <circle cx="112" cy="178" r="22"/>
      <circle cx="156" cy="178" r="22"/>
      <circle cx="200" cy="178" r="22"/>
      <circle cx="244" cy="178" r="22"/>
      <circle cx="288" cy="178" r="22"/>
    </g>
    <!-- Gesicht -->
    <circle class="h" cx="166" cy="136" r="14"/>
    <circle class="h" cx="234" cy="136" r="14"/>
    <circle class="v" cx="168" cy="138" r="8"/>
    <circle class="v" cx="232" cy="138" r="8"/>
    <path class="hl" stroke-width="8" d="M182 160 Q200 174 218 160"/>
  </g>
</svg>
