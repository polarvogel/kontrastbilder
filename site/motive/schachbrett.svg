<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <style>
    /* Farbrollen (siehe README). Die Fallback-Werte gelten nur beim direkten Öffnen der Datei. */
    .v { fill: var(--v, #000); }
    .h { fill: var(--h, #fff); }
    .f1 { fill: var(--f1, var(--v, #000)); }
    .f2 { fill: var(--f2, var(--v, #000)); }
    .f3 { fill: var(--f3, var(--v, #000)); }
    .vl, .hl, .f1l, .f2l, .f3l { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .vl { stroke: var(--v, #000); }
    .hl { stroke: var(--h, #fff); }
    .f1l { stroke: var(--f1, var(--v, #000)); }
    .f2l { stroke: var(--f2, var(--v, #000)); }
    .f3l { stroke: var(--f3, var(--v, #000)); }
  </style>

  <rect class="h" width="400" height="400"/>

  <!-- Schwarzes Brett 3 × 3, die vier weißen Felder als abgerundete Aussparungen -->
  <rect class="v" x="62" y="62" width="276" height="276" rx="30"/>
  <g class="h">
    <rect x="164" y="72" width="72" height="72" rx="18"/>
    <rect x="72" y="164" width="72" height="72" rx="18"/>
    <rect x="256" y="164" width="72" height="72" rx="18"/>
    <rect x="164" y="256" width="72" height="72" rx="18"/>
  </g>
</svg>
