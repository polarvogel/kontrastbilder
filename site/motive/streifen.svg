<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <style>
    /* Farbrollen (siehe README). Die Fallback-Werte gelten nur beim direkten Öffnen der Datei. */
    .v { fill: var(--v, #000); }
    .h { fill: var(--h, #fff); }
    .f1 { fill: var(--f1, var(--v, #000)); }
    .f2 { fill: var(--f2, var(--v, #000)); }
    .f3 { fill: var(--f3, var(--v, #000)); }
    .vl, .hl, .f1l, .f2l, .f3l { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .vl { stroke: var(--v, #000); }
    .hl { stroke: var(--h, #fff); }
    .f1l { stroke: var(--f1, var(--v, #000)); }
    .f2l { stroke: var(--f2, var(--v, #000)); }
    .f3l { stroke: var(--f3, var(--v, #000)); }
  </style>

  <rect class="h" width="400" height="400"/>

  <!-- Drei dicke Wellenlinien mit runden Enden -->
  <g class="vl" stroke-width="38">
    <path d="M78 124 q30.5 -32 61 0 t61 0 t61 0 t61 0"/>
    <path d="M78 200 q30.5 -32 61 0 t61 0 t61 0 t61 0"/>
    <path d="M78 276 q30.5 -32 61 0 t61 0 t61 0 t61 0"/>
  </g>
</svg>
