<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" data-farbe-f1="rot" data-farbe-f2="blau" data-farbe-f3="gruen">
  <style>
    /* Farbrollen (siehe README). Die Fallback-Werte gelten nur beim direkten Öffnen der Datei. */
    .v { fill: var(--v, #000); }
    .h { fill: var(--h, #fff); }
    .f1 { fill: var(--f1, var(--v, #000)); }
    .f2 { fill: var(--f2, var(--v, #000)); }
    .f3 { fill: var(--f3, var(--v, #000)); }
    .d1 { fill: var(--d1, var(--h, #fff)); }
    .vl, .hl, .f1l, .f2l, .f3l, .d1l { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .vl { stroke: var(--v, #000); }
    .hl { stroke: var(--h, #fff); }
    .f1l { stroke: var(--f1, var(--v, #000)); }
    .f2l { stroke: var(--f2, var(--v, #000)); }
    .f3l { stroke: var(--f3, var(--v, #000)); }
    .d1l { stroke: var(--d1, var(--h, #fff)); }
  </style>

  <rect class="h" width="400" height="400"/>

  <!-- Drei dicke Wellenlinien mit runden Enden -->
  <g stroke-width="38">
    <path class="f1l" d="M78 124 q30.5 -32 61 0 t61 0 t61 0 t61 0"/>
    <path class="f2l" d="M78 200 q30.5 -32 61 0 t61 0 t61 0 t61 0"/>
    <path class="f3l" d="M78 276 q30.5 -32 61 0 t61 0 t61 0 t61 0"/>
  </g>
</svg>
